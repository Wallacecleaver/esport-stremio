<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esportio · Dashboard</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090b10;--p:#11151d;--p2:#181d29;--p3:#1f2535;--b:#232a3b;--b2:#313a52;--t:#eef1f7;--m:#8f9ab2;--a:#ff4655;--a2:#ff7a85;--ok:#2dd4a0;--ko:#ff5d73;--w:#f5b942;--r:16px}
html{color-scheme:dark;font-size:14px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.5;min-height:100vh;background-image:radial-gradient(900px 380px at 70% -120px,rgba(255,70,85,.13),transparent 70%)}
a{color:inherit}
/* barre latérale */
aside{position:fixed;inset:0 auto 0 0;width:236px;background:rgba(13,16,23,.9);backdrop-filter:blur(12px);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:18px 14px;z-index:6}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ff4655,#b1263a);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,70,85,.35)}
.brand .lg svg{width:20px;height:20px;fill:#fff}
.brand b{display:block;font-weight:800;font-size:1rem;letter-spacing:-.01em;line-height:1.15}.brand small{color:var(--m);font-size:.74rem;font-weight:500}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{font:inherit;font-weight:600;color:var(--m);background:none;border:0;padding:10px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;transition:.15s}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{color:var(--t);background:rgba(255,255,255,.04)}
nav button.on{color:#fff;background:linear-gradient(90deg,rgba(255,70,85,.22),rgba(255,70,85,.05));box-shadow:inset 3px 0 0 var(--a)}
nav button .cnt{margin-left:auto;font-size:.72rem;background:var(--p3);color:var(--m);border-radius:99px;padding:1px 8px}
nav button .cnt.live{background:rgba(255,70,85,.2);color:var(--a2)}
.side-f{display:grid;gap:4px;border-top:1px solid var(--b);padding-top:12px}
.side-f a{color:var(--m);text-decoration:none;font-size:.86rem;font-weight:500;padding:8px 12px;border-radius:9px}.side-f a:hover{color:var(--t);background:rgba(255,255,255,.04)}
main{margin-left:236px;max-width:1180px;padding:28px 32px 70px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:1.65rem;font-weight:800;letter-spacing:-.025em;line-height:1.15}.top p{color:var(--m);margin-top:2px}
.top .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--p);border:1px solid var(--b);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--m)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(45,212,160,.18)}.dot.ko{background:var(--ko);box-shadow:0 0 0 3px rgba(255,93,115,.18)}
.dot.live{background:var(--a);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,70,85,.55)}70%{box-shadow:0 0 0 8px rgba(255,70,85,0)}100%{box-shadow:0 0 0 0 rgba(255,70,85,0)}}
/* cartes */
.grid{display:grid;gap:14px;grid-template-columns:repeat(6,1fr);margin-bottom:18px}@media(max-width:1250px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.k{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:var(--r);padding:16px 18px}
.k::after{content:"";position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;background:var(--kc,rgba(255,255,255,.04));filter:blur(2px)}
.k small{display:flex;align-items:center;gap:8px;color:var(--m);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.k small svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k b{display:block;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.k.red{--kc:rgba(255,70,85,.18)}.k.red b{color:var(--a)}.k.grn{--kc:rgba(45,212,160,.14)}.k.amb{--kc:rgba(245,185,66,.14)}.k.blu{--kc:rgba(96,165,250,.14)}
.box{background:linear-gradient(180deg,var(--p),#0f131a);border:1px solid var(--b);border-radius:var(--r);padding:20px;margin-bottom:18px}
.box h3{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.box h3 .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--m);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;border-bottom:1px solid var(--b);font-weight:700}
td{padding:10px;border-bottom:1px solid rgba(35,42,59,.7);vertical-align:middle}
tbody tr:hover td,table tr:not(:first-child):hover>td{background:rgba(255,255,255,.015)}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--p3);color:var(--m);white-space:nowrap}
.pill.ok{background:rgba(45,212,160,.13);color:var(--ok)}.pill.ko{background:rgba(255,93,115,.14);color:var(--ko)}.pill.w{background:rgba(245,185,66,.13);color:var(--w)}.pill.live{background:rgba(255,70,85,.16);color:var(--a2)}
button.b,a.b{font:inherit;font-weight:600;font-size:.84rem;color:var(--t);background:var(--p3);border:1px solid var(--b2);border-radius:10px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button.b:hover,a.b:hover{border-color:#52608a;background:#252c40}
button.b.pr{background:linear-gradient(135deg,#ff4655,#e23347);border-color:transparent;box-shadow:0 6px 16px rgba(255,70,85,.25)}button.b.pr:hover{filter:brightness(1.08)}button.b.dg{color:var(--ko)}
button.b.sm,a.b.sm{padding:4px 10px;font-size:.78rem;border-radius:8px}
input,select,textarea{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b2);border-radius:10px;padding:9px 12px;outline:none;width:100%;transition:.15s}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,70,85,.15)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--a)}input[type=file]::file-selector-button{font:inherit;font-weight:600;color:var(--t);background:var(--p3);border:1px solid var(--b2);border-radius:8px;padding:5px 12px;margin-right:12px;cursor:pointer}input[type=color]{padding:2px;height:38px;width:64px}
.f{display:grid;gap:5px;margin-bottom:13px}.f label{font-size:.72rem;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.07em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two>.box{margin-bottom:18px}
.tg{display:flex;align-items:flex-start;gap:11px;padding:9px 0}.tg span{font-size:.9rem}.tg input{margin-top:3px}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.bar>*{width:auto}.bar input{flex:1;min-width:170px}
.mut{color:var(--m)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.err{color:var(--ko)}.empty{color:var(--m);text-align:center;padding:30px}
.ch{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:16px}
.ch div{flex:1;background:linear-gradient(var(--a),rgba(255,70,85,.25));border-radius:8px 8px 3px 3px;position:relative;min-height:4px;transition:.2s}.ch div:hover{filter:brightness(1.2)}
.ch div span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:.74rem;color:var(--t);font-weight:600;padding-bottom:3px}
.ch-l{display:flex;gap:10px;margin-top:6px}.ch-l span{flex:1;text-align:center;font-size:.7rem;color:var(--m)}
.out{background:#0b0e14;border:1px solid var(--b);border-radius:11px;padding:13px;margin-top:10px;font-size:.84rem;white-space:pre-wrap;word-break:break-word}
.logrow td:first-child{white-space:nowrap;color:var(--m)}
/* matchs */
.tm{display:flex;align-items:center;gap:10px}.tm .vs{color:var(--m);font-size:.75rem;font-weight:700}
.lgo{width:28px;height:28px;border-radius:8px;background:var(--p3);display:grid;place-items:center;flex:none;overflow:hidden;font-size:.62rem;font-weight:800;color:var(--m)}.lgo img{width:100%;height:100%;object-fit:contain;padding:3px}
.tm b{font-weight:700}
.cc{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px}
.cc.emea{background:rgba(255,70,85,.14);color:#ff8b95}.cc.intl{background:rgba(167,139,250,.15);color:#b9a6ff}.cc.gc{background:rgba(244,114,182,.14);color:#f59bc7}.cc.ewc{background:rgba(245,185,66,.14);color:var(--w)}.cc.lolw,.cc.lec{background:rgba(200,170,110,.16);color:#d8be86}
.nx{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.mc{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--b);border-radius:13px;padding:12px 14px}
.mc.live{border-color:rgba(255,70,85,.5);box-shadow:0 0 0 1px rgba(255,70,85,.15),0 8px 24px rgba(255,70,85,.08)}
.mc .tt{flex:1;min-width:0}.mc .tt b{display:block}.mc .tt small{color:var(--m)}
.cmp{display:grid;grid-template-columns:1fr 70px 70px 80px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(35,42,59,.7)}.cmp:last-child{border:0}
.cmp .pb{height:7px;border-radius:99px;background:var(--p3);overflow:hidden;margin-top:6px}.cmp .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#ff8b95);border-radius:99px}
.dg-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(35,42,59,.7)}.dg-row:last-child{border:0}.dg-row .d{flex:1}.dg-row small{color:var(--m)}
.rp{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#toast{position:fixed;right:20px;bottom:20px;z-index:20;display:grid;gap:8px}
#toast div{background:var(--p3);border:1px solid var(--b2);border-left:3px solid var(--ok);padding:11px 16px;border-radius:11px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-weight:600;animation:in .2s}
#toast div.ko{border-left-color:var(--ko)}@keyframes in{from{transform:translateY(10px);opacity:0}}
@media(max-width:900px){
 aside{position:sticky;top:0;inset:auto;width:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--b)}
 .brand{padding:0}.brand div{display:none}nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}nav button{padding:8px 11px;white-space:nowrap}nav button span.t{display:none}nav button.on{box-shadow:none;background:rgba(255,70,85,.2)}
 .side-f{display:none}main{margin-left:0;padding:20px 14px 60px}.two{grid-template-columns:1fr}.top h1{font-size:1.35rem}.top .chips{margin-left:0}.cmp{grid-template-columns:1fr 50px 50px 60px}}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="lg"><svg viewBox="0 0 24 24"><path d="M6 4h11a1.5 1.5 0 010 3H8v2.2h5.6L16.8 12l-3.2 2.8H8V17h9a1.5 1.5 0 010 3H6.5A1.5 1.5 0 015 18.5V5.5A1.5 1.5 0 016 4z" fill="#fff"/></svg></span><div><b>Esportio</b><small>Dashboard</small></div></div>
  <nav id="nav"></nav>
  <div class="side-f"><a href="/config" target="_blank">Page de config ↗</a><a href="/admin/logout">Se déconnecter</a></div>
</aside>
<main><div class="top" id="top"></div><div id="m"><div class="empty">Chargement…</div></div></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = (p, body) => fetch('/admin/api/' + p, body ? { method: 'POST', body: JSON.stringify(body) } : {}).then(r => r.json());
const ago = t => { if (!t) return '—'; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? 'il y a ' + Math.floor(s) + ' s' : s < 3600 ? 'il y a ' + Math.floor(s / 60) + ' min' : s < 86400 ? 'il y a ' + Math.floor(s / 3600) + ' h' : 'il y a ' + Math.floor(s / 86400) + ' j'; };
const when = t => new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const IC = { over: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>', matches: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>', diag: '<path d="M22 12h-4l-3 8-6-16-3 8H2"/>', teams: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.2 3.2 0 010 6M18 14.5c1.7.8 3 2.7 3 5.5"/>', fn: '<circle cx="12" cy="12" r="9"/><path d="M8.5 15.5l3.5-7 3.5 7M9.8 13h4.4"/>', chans: '<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/>', set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>', prof: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M6 17c.5-2 2-3 3-3s2.5 1 3 3M14 10h4M14 14h4"/>', logs: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>' };
const ico = k => `<svg viewBox="0 0 24 24">${IC[k] || ''}</svg>`;
const TABS = [['over', 'Vue d\'ensemble', 'Matchs en direct, prochains matchs et état du système'], ['matches', 'Matchs', 'Tous les matchs lus sur valorantesports.com et lolesports.com'], ['diag', 'Diagnostic', 'Teste la source des matchs et Twitch depuis le serveur'], ['teams', 'Équipes', 'Équipes européennes proposées dans la config'], ['fn', 'Fortnite', 'Clé Osirion, événements et réglages des tournois Fortnite'], ['chans', 'Chaînes', 'Chaînes Twitch utilisées pour les lives et les rediffs'], ['set', 'Réglages', 'Identité, compétitions et fonctionnalités'], ['prof', 'Profils', 'Utilisateurs et leur activité'], ['logs', 'Journal', 'Activité et erreurs récentes']];
const toast = (t, ko) => { const d = document.createElement('div'); d.textContent = t; if (ko) d.className = 'ko'; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200); };
const logo = (u, c) => `<span class="lgo">${u ? `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(c || '').slice(0, 3)}'))">` : esc((c || '').slice(0, 3))}</span>`;
let tab = (location.hash || '#over').slice(1), S = null, MT = null, mf = { comp: '', state: '', q: '' };
$('#nav').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" onclick="go('${k}')">${ico(k)}<span class="t">${n}</span><span class="cnt" id="c_${k}" hidden></span></button>`).join('');
function go(k) { tab = k; location.hash = k; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); draw(); }
async function load() { S = await api('state'); draw(); }
function head() {
  const T = TABS.find(x => x[0] === tab) || TABS[0], d = S.data, ok = !d.error;
  $('#top').innerHTML = `<div><h1>${esc(T[1])}</h1><p>${esc(T[2])}</p></div><div class="chips"><span class="chip"><i class="dot ${ok ? '' : 'ko'}"></i>${ok ? 'Source OK' : 'Source en erreur'}${d.at ? ' · ' + ago(d.at) : ''}</span>${d.live ? `<span class="chip"><i class="dot live"></i>${d.live} en direct</span>` : ''}</div>`;
  const c = (id, n, live) => { const e = document.getElementById('c_' + id); if (e) { e.hidden = !n; e.textContent = n; e.className = 'cnt' + (live ? ' live' : ''); } };
  c('matches', d.total || 0); c('prof', S.users.length);
}
function draw() { if (!S) return; const f = { over, matches, diag, teams, chans, fnTab, set, prof, logs }[tab] || over; $('#m').innerHTML = ''; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.k === tab)); head(); f(); }
const put = h => { $('#m').innerHTML = h; };

// ---- vue d'ensemble
const CN = { emea: 'EMEA', intl: 'INTL', gc: 'GC', ewc: 'EWC', lolw: 'LoL·W', lec: 'LEC', lolewc: 'EWC·L' };
const kpi = (cls, label, icon, v) => `<div class="k ${cls}"><small><svg viewBox="0 0 24 24">${icon}</svg>${label}</small><b>${v}</b></div>`;
const matchCard = m => `<div class="mc ${m.state === 'live' ? 'live' : ''}"><div class="tm">${logo(m.al, m.ac)}${logo(m.bl, m.bc)}</div><div class="tt"><b>${esc(m.a)} <span class="mut">vs</span> ${esc(m.b)}</b><small>${esc(m.event)}${m.stage ? ' · ' + esc(m.stage) : ''}</small></div><div style="text-align:right">${m.state === 'live' ? '<span class="pill live"><i class="dot live"></i>direct</span>' : `<b>${new Date(m.start).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</b><br><small class="mut">${new Date(m.start).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })}</small>`}</div></div>`;
function over() {
  const d = S.data, st = S.stats || {}, total = S.uniq.reduce((a, b) => a + b, 0), mx = Math.max(1, ...S.uniq), nmax = Math.max(1, ...d.comps.map(c => c.n));
  put(`<div class="grid">
    ${kpi('red', 'En direct', '<circle cx="12" cy="12" r="3"/><path d="M7.8 7.8a6 6 0 000 8.4M16.2 7.8a6 6 0 010 8.4"/>', d.live ?? '—')}${kpi('amb', 'À venir', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', d.upcoming ?? '—')}${kpi('grn', 'Terminés', '<path d="M20 6L9 17l-5-5"/>', d.done ?? '—')}
    ${kpi('blu', 'Requêtes', '<path d="M3 12h4l3-8 4 16 3-8h4"/>', st.req || 0)}${kpi('', 'Appareils · 7 j', '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', total)}${kpi('', 'Profils', '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>', S.users.length)}</div>
  <div class="box" id="nxt"><h3>Matchs en cours et à venir</h3><div class="empty">Chargement…</div></div>
  <div class="two"><div class="box"><h3>État du système</h3><div class="tw"><table>${S.config.rows.map(r => `<tr><td class="mut">${esc(r[0])}</td><td>${esc(r[1])}</td><td style="text-align:right">${r[2] === true ? '<span class="pill ok">OK</span>' : r[2] === false ? '<span class="pill ko">À vérifier</span>' : ''}</td></tr>`).join('')}</table></div>
    ${d.error ? `<div class="out err">Source : ${esc(d.error)}${d.stale ? ' (copie en cache utilisée)' : ''}</div>` : `<p class="mut" style="margin-top:12px">Dernière lecture ${ago(d.at)}${d.stale ? ' · copie en cache' : ''}</p>`}
    ${(d.errors || []).length ? `<div class="out">${d.errors.map(esc).join('\n')}</div>` : ''}</div>

    <div class="two">${Object.entries(FNC).map(([k, n]) => `<div class="f"><label>${n}</label><input id="fp_${k}" value="${esc(P[k] || '')}" placeholder="${esc({ fnmajor: 'major', fnworld: 'global.?champ|worlds', fnewc: 'ewc|esports.?world.?cup' }[k])}"></div>`).join('')}
    <div class="f"><label>Régions gardées (séparées par des virgules)</label><input id="fp_reg" value="${esc((F.regions || []).join(', '))}" placeholder="EU, GLOBAL, ALL"></div></div>
    <label class="tg" style="margin-top:12px"><input type="checkbox" id="fp_stats" ${F.stats !== false ? 'checked' : ''}><span><b>Stats des joueurs</b><br><span class="mut">Affiche les meilleurs éliminateurs dans la fiche d'une session terminée (consomme des crédits Osirion)</span></span></label>
    <div class="two" style="margin-top:14px">${Object.entries(FNC).map(([k, n]) => `<div class="f"><label>Logo · ${n} (adresse https)</label><input id="fl_${k}" value="${esc((F.logos || {})[k] || '')}" placeholder="https://…"></div>`).join('')}</div>
    <div class="f" style="margin-top:12px"><label>Structures proposées (une ligne : <code>Nom | logo https (facultatif) | chaîne1, chaîne2</code>). Leurs chaînes passent en premier quand le spectateur les choisit.</label><textarea id="fp_st" rows="5" style="width:100%;font:inherit;color:inherit;background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:10px" placeholder="Karmine Corp | | karminecorp, autrechaine">${esc((F.structures || []).map(x => x.name + ' | ' + (x.logo || '') + ' | ' + x.channels.map(c => c.login).join(', ')).join('\n'))}</textarea></div>
    <div class="f" style="margin-top:12px"><label>Co-casters habituels, toujours proposés après les structures à la config (une ligne : <code>pseudo Twitch | nom | FR</code>)</label><textarea id="fp_sg" rows="4" style="width:100%;font:inherit;color:inherit;background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:10px" placeholder="leothecrack | Leothecrack | FR">${esc((F.suggest || []).map(x => x.login + ' | ' + x.label + ' | ' + x.lang).join('\n'))}</textarea></div>
    <div class="bar" style="margin-top:14px"><button class="b pr" onclick="fnSaveSet()">Enregistrer</button></div></div>
  <div class="box"><h3>Événements ajoutés à la main <span class="mut">(${(F.events || []).length})</span></h3>
    <p class="mut" style="margin-bottom:12px;font-size:.88rem">Pour les dates à venir qu'Osirion ne connaît pas encore. Une session par ligne : <code>Nom | début | fin | phase</code> (heure de Paris, ex : <code>Finale | 2026-11-22 19:00 | 2026-11-22 22:30 | Europe</code>). La fin et la phase sont facultatives.</p>
    ${(F.events || []).map(e => `<div class="dg-row"><div style="flex:1"><b>${esc(e.name)}</b> <span class="mut">${esc(FNC[e.comp] || e.comp)}</span><br><span class="mut" style="font-size:.84rem">${e.sessions.map(s => esc(s.name) + ' · ' + esc(s.start)).join(' · ')}${e.channels && e.channels.length ? '<br>Chaînes : ' + e.channels.map(esc).join(', ') : ''}</span></div><button class="b sm dg" onclick="fnDel('${esc(e.id)}')">Retirer</button></div>`).join('') || '<div class="empty">Aucun événement ajouté.</div>'}
    <div class="two" style="margin-top:14px"><div class="f"><label>Nom de l'événement</label><input id="fe_name" placeholder="FNCS Major 2"></div>
      <div class="f"><label>Compétition</label><select id="fe_comp">${Object.entries(FNC).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>
      <div class="f"><label>Logo (adresse https, facultatif)</label><input id="fe_logo" placeholder="https://…"></div>
      <div class="f"><label>Chaînes Twitch en plus (séparées par des virgules)</label><input id="fe_ch" placeholder="fortnite, kamet0"></div></div>
    <div class="f"><label>Sessions</label><textarea id="fe_s" rows="5" style="width:100%;font:inherit;color:inherit;background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:10px" placeholder="Jour 1 | 2026-11-21 18:00 | 2026-11-21 21:30\nFinale | 2026-11-22 19:00 | 2026-11-22 22:30 | Europe"></textarea></div>
    <div class="bar" style="margin-top:12px"><button class="b pr" onclick="fnAdd()">Ajouter l'événement</button></div></div>`);
}
async function osiSave() { const k = $('#ok').value.trim(); if (!k) return toast('Colle ta clé', true); const r = await api('osirion', { action: 'set', key: k }); toast(r.ok ? 'Clé enregistrée' : 'Erreur', !r.ok); fnTab(); }
async function osiDel() { if (!confirm('Supprimer la clé Osirion ?')) return; await api('osirion', { action: 'set', key: '' }); toast('Clé supprimée'); fnTab(); }
async function osiTest() {
  $('#ot').textContent = 'Test en cours…';
  const r = await api('osirion', { action: 'test' });
  $('#ot').innerHTML = r.ok ? '✅ Clé valide : ' + r.n + ' fenêtres de tournoi sur les 60 derniers jours' + (r.exemple && r.exemple.length ? '<br>Exemples : <code>' + r.exemple.map(esc).join('</code> <code>') + '</code>' : '') : '❌ ' + esc(r.error || 'Erreur');
}
async function fnSaveSet() {
  const F = S.site.fortnite || {}, patterns = {};
  for (const k of Object.keys(FNC)) { const v = $('#fp_' + k).value.trim(); if (v) { try { new RegExp(v); patterns[k] = v; } catch { return toast('Expression invalide : ' + FNC[k], true); } } }
  const logos = {}; for (const k of Object.keys(FNC)) { const v = $('#fl_' + k).value.trim(); if (v) logos[k] = v; }
  const suggest = $('#fp_sg').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a[0]).map(a => ({ login: a[0], label: a[1] || a[0], lang: /^en$/i.test(a[2]) ? 'EN' : 'FR' }));
  const structures = $('#fp_st').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a[0]).map(a => ({ name: a[0], logo: a[1] || '', channels: (a[2] || '').split(/[,\s]+/).filter(Boolean).map(l => ({ login: l, label: a[0], lang: 'FR' })) }));
  const r = await saveSite({ fortnite: { ...F, logos, suggest, structures, patterns, regions: $('#fp_reg').value.split(',').map(x => x.trim()).filter(Boolean), stats: $('#fp_stats').checked } });
  toast(r.ok === false ? 'Erreur' : 'Enregistré', r.ok === false);
}
async function fnAdd() {
  const F = S.site.fortnite || { events: [] }, name = $('#fe_name').value.trim();
  const sessions = $('#fe_s').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a[0] && a[1]).map(a => ({ name: a[0], start: a[1], end: a[2] || '', stage: a[3] || '' }));
  if (!name || !sessions.length) return toast('Nom et au moins une session (nom | début) obligatoires', true);
  const ev = { id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30) + '-' + Date.now().toString(36).slice(-3), comp: $('#fe_comp').value, name, logo: $('#fe_logo').value.trim(), channels: $('#fe_ch').value.split(',').map(x => x.trim()).filter(Boolean), sessions };
  const r = await saveSite({ fortnite: { ...F, events: [...(F.events || []), ev] } }); toast(r.ok === false ? 'Erreur' : 'Événement ajouté', r.ok === false); drawFn();
}
async function fnDel(id) { const F = S.site.fortnite; if (!confirm('Retirer cet événement ?')) return; await saveSite({ fortnite: { ...F, events: F.events.filter(e => e.id !== id) } }); toast('Événement retiré'); drawFn(); }
async function saveSite(o) { const r = await api('site', o); if (r.site) S.site = r.site; return r; }
function set() {
  const s = S.site, f = s.feat, tg = (k, n, d) => `<label class="tg"><input type="checkbox" id="f_${k}" ${f[k] ? 'checked' : ''}><span><b>${n}</b>${d ? '<br><span class="mut">' + d + '</span>' : ''}</span></label>`;
  put(`<div class="two"><div class="box"><h3>Identité</h3>
    <div class="f"><label>Nom de l'addon</label><input id="s_name" value="${esc(s.name)}"></div><div class="f"><label>Titre de la page config</label><input id="s_title" value="${esc(s.title)}"></div>
    <div class="f"><label>Texte d'accueil (facultatif)</label><input id="s_text" value="${esc(s.text)}"></div><div class="f"><label>Crédit en bas de page</label><input id="s_credit" value="${esc(s.credit)}"></div>
    <div class="f"><label>Couleur</label><input type="color" id="s_color" value="${esc(s.color)}"></div>
    <div class="f"><label>Logo (PNG, JPG ou WebP · 300 Ko max)</label><input type="file" id="s_logo" accept="image/png,image/jpeg,image/webp" onchange="upLogo(this)"><div class="bar" style="margin-top:6px"><img src="/logo.png?v=${s.logoV}" width="44" height="44" style="border-radius:10px"><button class="b dg" onclick="rmLogo()">Retirer</button></div></div></div>
  <div class="box"><h3>Accès</h3><label class="tg"><input type="checkbox" id="s_open" ${s.open ? 'checked' : ''}><span><b>Inscriptions ouvertes</b></span></label>
    <div class="f"><label>Code d'invitation (vide = aucun)</label><input id="s_code" value="${esc(s.code)}"></div>
    <h3 style="margin-top:18px">Compétitions proposées</h3>${S.data.comps.map(c => `<label class="tg"><input type="checkbox" class="s_comp" value="${c.id}" ${c.on ? 'checked' : ''}><span>${esc(c.name)}</span></label>`).join('')}
    <div class="f" style="margin-top:12px"><label>Première année du catalogue</label><input id="s_year" type="number" min="2020" max="2100" value="${s.startYear}"></div>
    <div class="f"><label>Mots-clés de ligues en plus (virgules)</label><input id="s_kw" value="${esc(s.extraKeywords.join(', '))}" placeholder="showmatch, …"></div></div></div>
  <div class="box"><h3>Fonctionnalités</h3><div class="two"><div>${tg('live', 'Lives Twitch', 'Sources en direct dans chaque match')}${tg('discover', 'Recherche auto des lives', 'Trouve les co-casts (titre Twitch citant les équipes, chaînes Liquipedia)')}${tg('relay', 'Relais sans pub', 'Lives passés par des relais sans publicité (flux officiel en secours)')}${tg('replays', 'Rediffusions', 'Catalogue et sources des matchs terminés')}${tg('posters', 'Affiches générées', 'Logos, heure et enjeu')}${tg('logs', 'Journal', 'Enregistre l\'activité')}</div>
    <div><div class="f"><label>Qualité maximale imposée</label><select id="f_capMax">${[0, 1440, 1080, 720, 480].map(x => `<option value="${x}" ${f.capMax === x ? 'selected' : ''}>${x ? x + 'p' : 'Aucune limite'}</option>`).join('')}</select></div>
    <div class="f"><label>Matchs à venir affichés</label><input id="f_upcoming" type="number" min="6" max="60" value="${f.upcoming}"></div><div class="f"><label>Rediffusions affichées</label><input id="f_doneMax" type="number" min="10" max="200" value="${f.doneMax}"></div></div></div>
    ${tg('maint', 'Mode maintenance', 'Les sources affichent le message ci-dessous')}<div class="f"><input id="f_maintMsg" value="${esc(f.maintMsg)}" placeholder="Message de maintenance"></div></div>
  <div class="bar"><button class="b pr" onclick="saveSettings()">Enregistrer les réglages</button></div>`);
}
async function saveSettings() {
  const v = id => $('#' + id).value, c = id => $('#' + id).checked;
  const o = { name: v('s_name'), title: v('s_title'), text: v('s_text'), credit: v('s_credit'), color: v('s_color'), open: c('s_open'), code: v('s_code'), startYear: Number(v('s_year')),
    comps: [...document.querySelectorAll('.s_comp:checked')].map(x => x.value), extraKeywords: v('s_kw').split(',').map(x => x.trim()).filter(Boolean),
    feat: { live: c('f_live'), discover: c('f_discover'), relay: c('f_relay'), replays: c('f_replays'), posters: c('f_posters'), logs: c('f_logs'), maint: c('f_maint'), maintMsg: v('f_maintMsg'), capMax: Number(v('f_capMax')), upcoming: Number(v('f_upcoming')), doneMax: Number(v('f_doneMax')) } };
  const r = await saveSite(o); toast(r.ok ? 'Réglages enregistrés' : 'Erreur', !r.ok); MT = null; await load(); go('set');
}
function upLogo(i) { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = async () => { const x = await api('site/logo', { data: r.result }); toast(x.ok ? 'Logo mis à jour' : x.error, !x.ok); await load(); go('set'); }; r.readAsDataURL(f); }
async function rmLogo() { await api('site/logo', { data: '' }); await load(); go('set'); }

// ---- profils
async function prof() {
  put('<div class="empty">Chargement…</div>'); const r = await api('profiles');
  put(`<div class="box"><h3>Profils <span class="mut">(${r.profils.length})</span></h3>${!S.persistent ? '<p class="err">Base Upstash non configurée : les profils n\'existent que sur les liens classiques.</p>' : ''}<div class="tw"><table><tr><th>Pseudo</th><th>Appareil</th><th>Réglages</th><th>Mis à jour</th><th></th></tr>
    ${r.profils.map(p => `<tr><td><b>${esc(p.pseudo)}</b>${p.pw ? '' : ' <span class="pill w">sans mot de passe</span>'}</td><td>${esc(p.device)}</td><td class="mut">${esc((p.cfg.comps || []).join('+'))}${(p.cfg.teams || []).length ? ' · ⭐ ' + esc(p.cfg.teams.join(', ')) : ''} · ${esc(p.cfg.lang || '')}</td><td class="mut">${ago(p.maj)}</td>
      <td><button class="b" onclick="pact('${p.ref}','reset')">Réinit. mot de passe</button> <button class="b dg" onclick="pact('${p.ref}','delete')">Supprimer</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Aucun profil</td></tr>'}</table></div></div>
    <div class="box"><h3>Activité des utilisateurs</h3><div class="tw"><table><tr><th>Pseudo</th><th>Requêtes</th><th>Dernière activité</th><th>Appareil</th></tr>${S.users.sort((a, b) => (b.last || 0) - (a.last || 0)).map(u => `<tr><td>${esc(u.pseudo)}</td><td>${u.n}</td><td class="mut">${ago(u.last)}</td><td class="mut">${esc(u.dev || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Rien pour l\'instant</td></tr>'}</table></div></div>`);
}
async function pact(ref, action) { if (!confirm(action === 'delete' ? 'Supprimer ce profil ? Son lien cessera de fonctionner.' : 'Retirer le mot de passe ? La personne pourra en choisir un nouveau.')) return; await api('profiles', { ref, action }); prof(); }

// ---- journal
let lv = '';
function logs() {
  const rows = S.logs.filter(l => !lv || l.lvl === lv);
  put(`<div class="box"><h3>Journal <span class="mut">(${rows.length})</span><span class="sp"><a class="b" href="/admin/api/export?fmt=csv">CSV</a><a class="b" href="/admin/api/export?fmt=json">JSON</a><button class="b dg" onclick="if(confirm('Vider le journal ?'))api('reset?what=logs',{}).then(load)">Vider</button></span></h3>
    <div class="bar"><select onchange="lv=this.value;logs()">${[['', 'Tous les niveaux'], ['ERROR', 'Erreurs'], ['WARN', 'Alertes'], ['INFO', 'Infos']].map(([v, n]) => `<option value="${v}" ${lv === v ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="b" onclick="load()">Actualiser</button></div>
    <div class="tw"><table>${rows.slice(0, 250).map(l => { const { t, lvl, k, u, dev, ...r } = l; return `<tr class="logrow"><td>${when(t)}</td><td><span class="pill ${lvl === 'ERROR' ? 'ko' : lvl === 'WARN' ? 'w' : ''}">${esc(lvl)}</span></td><td>${esc(k || '')}${u ? ' · <b>' + esc(u) + '</b>' : ''}</td><td class="mono mut">${esc(Object.entries(r).map(([a, b]) => a + '=' + (typeof b === 'object' ? JSON.stringify(b) : b)).join('  '))}</td></tr>`; }).join('') || '<tr><td class="empty">Journal vide</td></tr>'}</table></div></div>`);
}
load();
</script>
</body>
</html>
